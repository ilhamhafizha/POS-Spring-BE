<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PadiPos — Settings</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="pages.css"><script type="module" src="account.js"></script></head><body class="admin-page"><aside class="sidebar" aria-label="Main navigation"></aside><div class="workspace"><header class="header"></header><main class="admin-main"><div class="dashboard-heading"><div><p class="eyebrow">BACK OFFICE</p><h1>Settings</h1><p class="page-description">Configure your store and checkout preferences.</p></div></div><div class="preview-notice"><span class="preview-badge">Store</span><p>Settings apply to new checkouts across your store.</p></div><form id="settings-form" class="settings-grid"><section class="dashboard-card form-section"><h2>Store Information</h2><p class="card-subtitle">Your store details and receipt message.</p><label>Store name<input id="store-name" required maxlength="80"></label><label>Phone<input id="store-phone" type="tel" maxlength="30"></label><label>Address<textarea id="store-address" rows="3" maxlength="300"></textarea></label><label>Receipt message<textarea id="store-receipt" rows="2" maxlength="200"></textarea></label></section><section class="dashboard-card form-section"><h2>Checkout Settings</h2><p class="card-subtitle">Tax is calculated once per order.</p><label>Currency<input value="IDR — Indonesian Rupiah" readonly></label><label>Tax type<select id="tax-mode"><option value="fixed">Fixed amount per order</option><option value="percent">Percentage of subtotal</option><option value="none">No tax</option></select></label><label id="tax-label"><span id="tax-value-label">Tax amount (IDR)</span><input id="tax-value" type="number" min="0" step="0.01" required></label><label>Number of tables<input id="store-tables" type="number" min="1" max="50" step="1" required></label><div class="tax-preview"><span>Example: Rp 100.000 subtotal</span><strong id="tax-example"></strong></div></section><div class="settings-actions"><p id="settings-error" class="error" role="alert"></p><button type="reset" class="secondary">Discard Changes</button><button type="submit" class="primary compact">Save Settings</button></div></form></main></div></body></html>
