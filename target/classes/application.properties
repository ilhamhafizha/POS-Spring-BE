spring.application.name=pos-backend
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
pos.bootstrap.admin-email=${ADMIN_EMAIL:}
pos.bootstrap.admin-password=${ADMIN_PASSWORD:}
pos.bootstrap.cashier-email=${CASHIER_EMAIL:}
pos.bootstrap.cashier-password=${CASHIER_PASSWORD:}
pos.seed-reference-product=${SEED_REFERENCE_PRODUCT:false}
