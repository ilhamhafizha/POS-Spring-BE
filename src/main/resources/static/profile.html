<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PadiPos — My Profile</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="pages.css"><script type="module" src="account.js"></script></head><body class="admin-page"><aside class="sidebar" aria-label="Main navigation"></aside><div class="workspace"><header class="header"></header><main class="admin-main"><div class="dashboard-heading"><div><p class="eyebrow">ACCOUNT</p><h1>My Profile</h1><p class="page-description">Manage the profile shown across your workspace.</p></div></div><div class="profile-layout"><section class="dashboard-card profile-overview"><img class="profile-photo" src="assets/126-41246-imgFrame1000004552.png" alt="Profile avatar"><h2 id="profile-display-name"></h2><p id="profile-display-email" class="muted"></p><span id="profile-role" class="status-pill"></span><p class="field-help">Store account</p><button id="profile-logout" class="secondary">Log out</button></section><form id="profile-form" class="dashboard-card form-section"><h2>Personal Information</h2><p class="card-subtitle">Changes are saved to your account.</p><label>Full name<input id="profile-name" required maxlength="80" autocomplete="name"></label><label>Email address<input id="profile-email" type="email" required maxlength="150" autocomplete="email"></label><label>Phone number<input id="profile-phone" type="tel" maxlength="30" autocomplete="tel"></label><p id="profile-error" class="error" role="alert"></p><div class="form-actions"><button type="reset" class="secondary">Discard Changes</button><button type="submit" class="primary compact">Save Profile</button></div></form></div></main></div></body></html>
